<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmp-pyramid-title cmp-pyramid-desc">
      <title id="cmp-pyramid-title">비교 구문 3단계 피라미드 — 원급·비교급·최상급</title>
      <desc id="cmp-pyramid-desc">비교 대상의 개수가 늘어날수록 원급비교에서 비교급을 거쳐 최상급으로 올라가는 3단 피라미드로, 각 단에 as tall as, taller than, the tallest 예문이 표시된다.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6575"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff8a3d"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6d4dd1"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fffdf7"/>

      <!-- Left margin axis: arrow drawn before boxes -->
      <line x1="120" y1="296" x2="120" y2="88" stroke="#6b6575" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="88" y="292" width="64" height="14" fill="#fffdf7"/>
      <text x="120" y="303" fill="#6b6575" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">대상 2개</text>
      <rect x="88" y="72" width="64" height="14" fill="#fffdf7"/>
      <text x="120" y="83" fill="#6b6575" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3개 이상</text>

      <!-- Layer 1: base — 원급비교 -->
      <polygon points="280,224 720,224 820,296 180,296" fill="#fffaf0" stroke="#6b6575" stroke-width="1"/>
      <!-- Layer 2: mid — 비교급 -->
      <polygon points="380,152 620,152 720,224 280,224" fill="#fffaf0" stroke="#6b6575" stroke-width="1"/>
      <!-- Layer 3: apex — 최상급 (focal) -->
      <polygon points="480,80 520,80 620,152 380,152" fill="rgba(255,138,61,0.12)" stroke="#ff8a3d" stroke-width="1.2"/>

      <!-- Layer text -->
      <text x="500" y="256" fill="#3f3a45" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">원급비교</text>
      <text x="500" y="272" fill="#6b6575" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">as + 원급 + as</text>

      <text x="500" y="184" fill="#3f3a45" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">비교급</text>
      <text x="500" y="200" fill="#6b6575" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">-er / more ~ than</text>

      <text x="500" y="120" fill="#3f3a45" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">최상급</text>
      <text x="500" y="135" fill="#6b6575" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">the -est/most</text>

      <!-- Right-side example annotations -->
      <text x="860" y="264" fill="#3f3a45" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">as tall as</text>
      <text x="860" y="192" fill="#3f3a45" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">taller than</text>
      <text x="860" y="120" fill="#ff8a3d" font-size="14" font-style="italic" font-weight="600" font-family="'Instrument Serif', serif">the tallest</text>
      <rect x="856" y="60" width="72" height="16" fill="#fffdf7"/>
      <text x="856" y="72" fill="#8b8593" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">예문</text>

      <!-- Legend strip -->
      <line x1="40" y1="320" x2="1000" y2="320" stroke="#efe5d8" stroke-width="0.8"/>
      <text x="40" y="340" fill="#6b6575" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="332" width="12" height="12" rx="2" fill="rgba(255,138,61,0.12)" stroke="#ff8a3d" stroke-width="1.2"/>
      <text x="160" y="342" fill="#6b6575" font-size="9" font-family="'Geist Mono', monospace">최상급 = 대상 3개 이상 비교</text>
      <text x="480" y="342" fill="#6b6575" font-size="9" font-family="'Geist Mono', monospace">↑ 세로축 = 비교 대상의 개수</text>
    </svg>
