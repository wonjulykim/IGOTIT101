<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rel-nest-title rel-nest-desc">
      <title id="rel-nest-title">관계대명사절의 내포 구조</title>
      <desc id="rel-nest-desc">전체 문장 상자 안에 선행사인 명사 상자가 있고, 그 명사 상자 안에 그것을 뒤에서 꾸며주는 관계대명사절 상자가 겹겹이 들어있는 구조를 The man who lives next door is a doctor 예문으로 보여준다.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6575"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ff8a3d"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6d4dd1"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fffdf7"/>

      <!-- Level 1: whole sentence — outermost -->
      <rect x="40" y="72" width="920" height="380" rx="8" fill="rgba(63,58,69,0.015)" stroke="rgba(63,58,69,0.30)" stroke-width="1"/>
      <!-- Level 2: antecedent (noun) -->
      <rect x="72" y="108" width="856" height="308" rx="8" fill="rgba(63,58,69,0.025)" stroke="rgba(63,58,69,0.45)" stroke-width="1"/>
      <!-- Level 3: relative clause — innermost, focal -->
      <rect x="104" y="144" width="792" height="236" rx="8" fill="rgba(255,138,61,0.08)" stroke="#ff8a3d" stroke-width="1.2"/>

      <!-- Level labels on paper-colored masks, sitting on each ring's top border -->
      <rect x="56" y="60" width="220" height="24" fill="#fffdf7"/>
      <text x="64" y="76" fill="#6b6575" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.06em">전체 문장 · SENTENCE</text>

      <rect x="88" y="96" width="252" height="24" fill="#fffdf7"/>
      <text x="96" y="112" fill="#6b6575" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.06em">선행사(명사) · ANTECEDENT</text>

      <rect x="120" y="132" width="272" height="24" fill="#fffdf7"/>
      <text x="128" y="148" fill="#ff8a3d" font-size="13" font-family="'Geist Mono', monospace" letter-spacing="0.06em" font-weight="600">관계대명사절 · 형용사 역할</text>

      <!-- "the man" — sits in the gap between level 2 and level 3, just above the inner ring -->
      <text x="500" y="132" fill="#3f3a45" font-size="17" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the man</text>

      <!-- Innermost content: the relative clause itself -->
      <text x="500" y="264" fill="#3f3a45" font-size="24" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">who lives next door</text>
      <text x="500" y="288" fill="#6b6575" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">the man을 뒤에서 수식 (형용사절)</text>

      <!-- "is a doctor." — sits in the gap between level 1 and level 2, below the noun-phrase ring -->
      <text x="500" y="440" fill="#3f3a45" font-size="18" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">is a doctor.</text>

      <!-- Editorial callouts (max 2) -->
      <text x="920" y="40" fill="#3f3a45" font-size="17" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">The man who lives next door is a doctor.</text>
      <text x="40" y="496" fill="#6b6575" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">관계대명사절 = 명사를 꾸미는 긴 형용사</text>
    </svg>
